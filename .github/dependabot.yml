version: 2
updates:
  # The plugin has no runtime dependencies, so nothing here affects what users
  # install. These keep the *development* surface current: the Actions used by CI
  # and the packages the offline test suite resolves.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"
